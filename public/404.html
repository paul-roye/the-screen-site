<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Barlow+Semi+Condensed:wght@400;500;700&family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Grenze+Gotisch:wght@500;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="/site.css">
<script>try { if (localStorage.getItem('ambiance') !== 'aeldran') document.documentElement.dataset.ambiance = 'strahd'; } catch (e) {}</script>
</head>
<body>
<!-- Sans cette page, Cloudflare Pages répond la page d'accueil, avec un code 200, à toute adresse inconnue :
     un zip absent se téléchargerait comme une page HTML. -->
<main class="dedans" style="padding-block: 4rem 5rem; display: flex; flex-direction: column; gap: 1rem">
  <p class="sur">Erreur 404</p>
  <h1>Il n’y a rien à cette adresse</h1>
  <p class="chapo">Le fichier ou la page demandés n’existent pas, ou plus. Si c’était un téléchargement, la version a peut-être changé de nom : la page principale pointe toujours vers la dernière.</p>
  <div class="actions"><a class="btn btn--fort" href="/">Retour au site</a></div>
</main>
</body>
</html>
